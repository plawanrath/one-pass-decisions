name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r scripts/env/requirements.ci.txt && pip install -e . --no-deps
      - run: python -m pytest -q -m "not slow and not gpu and not docker"
